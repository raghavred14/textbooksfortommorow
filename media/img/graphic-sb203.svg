<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Texas Senate Bill 203, relating to the disclosure of a public school student's numerical class rank">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e7cff"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0e1530" flood-opacity=".45"/></filter>
</defs>
<!-- capitol dome, behind the page -->
<g opacity=".22" fill="#fff">
  <rect x="120" y="560" width="300" height="150"/>
  <path d="M170 560 v-70 h200 v70z"/>
  <path d="M195 490 a75 75 0 0 1 150 0z"/>
  <rect x="266" y="400" width="8" height="40"/>
  <rect x="266" y="400" width="34" height="14"/>
</g>
<!-- page -->
<g filter="url(#sh)">
  <rect x="330" y="80" width="540" height="650" rx="16" fill="#fff"/>
</g>
<rect x="330" y="80" width="540" height="22" rx="11" fill="#f2b134"/>
<text x="600" y="168" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#4353e6">TEXAS SENATE BILL</text>
<text x="600" y="300" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="150" font-weight="800" fill="#1b2a6b">SB 203</text>
<text x="600" y="352" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#5b6577">89th Legislature · 2025</text>
<rect x="400" y="388" width="400" height="4" rx="2" fill="#e6e1d6"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">
  <text x="600" y="454">Relating to the disclosure</text>
  <text x="600" y="496">of a public school student's</text>
  <text x="600" y="538">numerical class rank.</text>
</g>
<rect x="420" y="596" width="360" height="12" rx="6" fill="#eef1ff"/>
<rect x="450" y="626" width="300" height="12" rx="6" fill="#eef1ff"/>
<rect x="480" y="656" width="240" height="12" rx="6" fill="#eef1ff"/>
<!-- seal -->
<g transform="translate(790 650)">
  <circle r="54" fill="#f2b134"/><circle r="44" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 5"/>
  <path d="M0 -22 l6.5 14 15 2 -11 10.5 3 15 -13.5 -7.5 -13.5 7.5 3 -15 -11 -10.5 15 -2z" fill="#1b2a6b"/>
</g>
</svg>
